# 多目标 /probe（:9401）。配置：根目录 config.yaml（不入库）
# 构建：docker compose up -d --build
name: ikuai-exporter

services:
    exporter:
        image: ikuai-exporter:local
        build:
            context: .
            dockerfile: Dockerfile
            target: local
        container_name: ikuai_exporter
        restart: unless-stopped
        ports:
            - "9401:9401"
        volumes:
            - ./config.yaml:/config/config.yaml:ro
        command:
            - server
            - --config.file=/config/config.yaml
            - --web.listen-address=:9401
